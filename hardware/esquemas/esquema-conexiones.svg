<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" font-family="sans-serif">
  <rect x="0" y="0" width="960" height="800" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold">Otto DIY — Esquema de conexiones ESP32 (documentativo, sin PCB propia)</text>

  <!-- ESP32 -->
  <rect x="360" y="60" width="250" height="470" fill="#f4f6f8" stroke="#333" stroke-width="2" rx="8"/>
  <text x="380" y="85" font-size="15" font-weight="bold">ESP32-WROOM</text>
  <text x="380" y="102" font-size="12">Lógica 3.3V · Servos a fuente 5V</text>

  <g font-size="13">
    <rect x="380" y="115" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="133">GPIO32 → Cadera Izq. (S)</text>
    <rect x="380" y="145" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="163">GPIO33 → Cadera Der. (S)</text>
    <rect x="380" y="175" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="193">GPIO25 → Tobillo Izq. (S)</text>
    <rect x="380" y="205" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="223">GPIO26 → Tobillo Der. (S)</text>
    <rect x="380" y="245" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="263">GPIO18 → Trig HC-SR04</text>
    <rect x="380" y="275" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="293">GPIO19 → Echo (divisor)</text>
    <rect x="380" y="305" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="323">GPIO27 → Buzzer +</text>
    <rect x="380" y="345" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="363">5V → HC-SR04 VCC</text>
    <rect x="380" y="375" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="393">GND → GND común</text>
    <rect x="380" y="415" width="210" height="26" fill="#fff7e6" stroke="#333"/><text x="390" y="433">VIN ← (+) vía switch</text>
    <rect x="380" y="445" width="210" height="26" fill="#fff7e6" stroke="#333"/><text x="390" y="463">GND ← (-) fuente</text>
    <rect x="380" y="485" width="210" height="26" fill="#fff" stroke="#333"/><text x="390" y="503">GPIO2 → banco 1 servo</text>
  </g>

  <!-- Servos -->
  <g font-size="13">
    <rect x="20" y="115" width="270" height="150" fill="#eef6ff" stroke="#333" rx="6"/>
    <text x="30" y="135" font-weight="bold">4x SG90</text>
    <text x="30" y="153">Naranja→GPIO (S)</text>
    <text x="30" y="169">Rojo→5V fuente (V)</text>
    <text x="30" y="185">Marrón→GND común (G)</text>
    <text x="30" y="206">· CI→32 · CD→33</text>
    <text x="30" y="222">· TI→25 · TD→26</text>
    <text x="30" y="243">Nunca al 3V3 ni al USB</text>
  </g>

  <!-- HC-SR04 -->
  <rect x="20" y="280" width="270" height="120" fill="#eef6ff" stroke="#333" rx="6"/>
  <text x="30" y="300" font-size="13" font-weight="bold">HC-SR04</text>
  <text x="30" y="318" font-size="13">VCC→5V, Trig→GPIO18</text>
  <text x="30" y="334" font-size="13">Echo→GPIO19 vía divisor:</text>
  <text x="30" y="350" font-size="13">Echo—[1k]—+—GPIO19</text>
  <text x="30" y="366" font-size="13">+—[2k]—GND (=3.3V)</text>
  <text x="30" y="384" font-size="13">GND→GND común</text>

  <!-- Buzzer -->
  <rect x="20" y="415" width="270" height="70" fill="#eef6ff" stroke="#333" rx="6"/>
  <text x="30" y="435" font-size="13" font-weight="bold">Buzzer (opcional)</text>
  <text x="30" y="453" font-size="13">+ → GPIO27 · - → GND</text>
  <text x="30" y="469" font-size="13">Sin buzzer anda igual</text>

  <!-- Power -->
  <rect x="640" y="280" width="300" height="220" fill="#fff7e6" stroke="#333" rx="6"/>
  <text x="650" y="300" font-size="13" font-weight="bold">Fuente 5V 2A (baterías o adaptador)</text>
  <text x="650" y="320" font-size="13">USB del PC = solo lógica,</text>
  <text x="650" y="336" font-size="13">NO mueve servos (500mA)</text>
  <rect x="650" y="350" width="280" height="30" fill="#fff" stroke="#333"/>
  <text x="660" y="370" font-size="13">[ Interruptor ] + en serie</text>
  <text x="650" y="395" font-size="13">(+) → switch → 5V servos + VIN</text>
  <text x="650" y="413" font-size="13">(-) → GND común (fuente+ESP32)</text>
  <text x="650" y="435" font-size="12">Programar por USB: fuente OFF</text>
  <text x="650" y="453" font-size="12">Sin GND común: jitter/resets</text>
  <text x="650" y="475" font-size="12">Orden: USB → subir → fuente ON</text>

  <!-- Lines -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="290" y1="190" x2="360" y2="170"/>
    <line x1="290" y1="330" x2="360" y2="280"/>
    <line x1="290" y1="450" x2="360" y2="318"/>
    <line x1="610" y1="428" x2="640" y2="400"/>
    <line x1="610" y1="458" x2="640" y2="420"/>
  </g>

  <!-- Steps -->
  <text x="20" y="560" font-size="15" font-weight="bold">Cómo armarlo (orden de cableado)</text>
  <g font-size="13">
    <text x="20" y="582">1. ESP32 solo por USB → monitor 115200.</text>
    <text x="20" y="602">2. HC-SR04 (VCC→5V, TRIG→18, ECHO→19 con divisor) → verifica dist.</text>
    <text x="20" y="622">3. Buzzer opcional (+→27, -→GND).</text>
    <text x="20" y="642">4. Un servo en banco: naranja→GPIO2, sin fuente (env manual_1sg90).</text>
    <text x="20" y="662">5. Fuente apagada: rojo→5V, marrón→GND común, switch en (+).</text>
    <text x="20" y="682">6. Cuatro servos (32/33/25/26) → calibracion_90 → recién ahí, mecánica.</text>
    <text x="20" y="702">7. Ordena cables en el cuerpo sin tocar los horns.</text>
    <text x="20" y="722">8. wifi_secrets.h (red 2.4GHz) → http://&lt;ip&gt;/ desde el teléfono.</text>
  </g>

  <text x="20" y="752" font-size="12">Naranja=S · Rojo=5V · Marrón=GND. Echo nunca directo a 5V. Previo: 90° con calibracion_90.</text>
  <text x="20" y="772" font-size="12">Detalle: docs/05-guia-conexiones.md · Mecánica: docs/09 · Fuente STL/BOM: hardware/stl/ + docs/03.</text>
</svg>
