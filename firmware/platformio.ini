; Otto DIY en ESP32-WROOM — SDD C++ con PlatformIO
; Base sin red + extra WiFi único 2.4 GHz (BT deshabilitado).
; Placa: ESP32-WROOM (esp32dev), framework Arduino.

[env:otto_esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Compila todo src salvo el test de 1 servo
src_filter = +<*> -<test_1sg90.cpp>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSIM_SIN_SERVOS=1
  -DENABLE_WIFI_MODULE=0

; Base + panel WiFi (modos exposición/manual por red).
; Edita src/wifi_secrets.h con tu red 2.4 GHz antes de subir.
[env:otto_esp32_wifi]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_filter = +<*> -<test_1sg90.cpp>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSIM_SIN_SERVOS=1
  -DENABLE_WIFI_MODULE=1

; Test con 1 solo SG90 + HC-SR04. En VSCode cambia el env abajo a la derecha.
[env:test_1sg90]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_filter = +<*> -<main.cpp> -<core/*> -<modules/*>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSIM_SIN_SERVOS=1

; Tests unitarios Unity en placa (solo headers puros, sin src/).
; Corre con: pio test -e test_core_esp32 (sube y lee resultados por serial).
[env:test_core_esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
test_framework = unity
test_filter = test_core
test_build_src = no
lib_deps =
  throwtheswitch/Unity
build_flags =
  -DCORE_DEBUG_LEVEL=0
