; Otto DIY en ESP32-WROOM — Fase 1 C++ / Fase 2 port Rust
; VSCode + PlatformIO, sin servos aún (SIM_SIN_SERVOS=1 en src/config.h)

[env:otto_esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_filter = +<*.h> +<main.cpp> -<test_1sg90.cpp>
lib_deps =
  ottodiy/OttoDIYLib
  madhephaestus/ESP32Servo
  https://github.com/OttoDIY/OttoDIYESP/archive/master.zip
build_flags =
  -DCORE_DEBUG_LEVEL=0

; Test con 1 solo SG90 + HC-SR04. En VSCode cambia el env abajo a la derecha.
[env:test_1sg90]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_filter = +<*.h> +<test_1sg90.cpp> -<main.cpp>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
