; Otto DIY en ESP32-WROOM — SDD C++ con PlatformIO
; Proyecto en RAIZ del repo: se compila desde aqui (pio run / pio test).
; Codigo en firmware/src/, tests en firmware/test/.
; Base: servos + proximidad + WiFi + dashboard, siempre presentes.
; Placa: ESP32-WROOM (esp32dev), framework Arduino.

[platformio]
src_dir = firmware/src
test_dir = firmware/test
default_envs = otto_esp32

[env:otto_esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Producción: todo src salvo herramientas de banco
build_src_filter = +<*> -<tools/>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSIM_SIN_SERVOS=1

; Alias de compatibilidad: el WiFi ya es parte del core (siempre on).
; Edita firmware/src/wifi_secrets.h con tu red 2.4 GHz antes de subir.
[env:otto_esp32_wifi]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<tools/>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSIM_SIN_SERVOS=1

; Banco con 1 solo SG90 + HC-SR04 (herramienta, no test automatizado).
; En VSCode cambia el env abajo a la derecha.
[env:manual_1sg90]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<main.cpp> -<core/> -<modules/> -<tools/calibracion_90.cpp>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSIM_SIN_SERVOS=1

; Calibración: 4 servos a 90° para montaje mecánico (herramienta).
[env:calibracion_90]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<main.cpp> -<core/> -<modules/> -<tools/manual_1sg90.cpp>
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSIM_SIN_SERVOS=1

; Tests unitarios Unity en placa (solo headers puros, sin src/).
; Corre desde la raiz con: pio test -e test_core_esp32 (sube y lee por serial).
[env:test_core_esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
test_framework = unity
test_filter = test_core
test_build_src = no
lib_deps =
  throwtheswitch/Unity
build_flags =
  -DCORE_DEBUG_LEVEL=0

; Tests unitarios Unity en PC (mismos headers puros, sin Arduino).
; Corre desde la raiz con: pio test -e native
[env:native]
platform = native
test_framework = unity
test_filter = test_core
test_build_src = no
build_flags =
  -DCORE_DEBUG_LEVEL=0
